name: Loader suite contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python tooling/check_loader_components.py
      - run: python tests/test_universal_loader_sync.py
      - run: python tests/test_loader_suite.py
      - run: python probes/native-loader/tools/test_prepare.py
      - run: python tests/test_oversized_example.py
