name: Reconstruct validated offline release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag with transfer parts
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download transfer parts from draft
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          gh release download "$RELEASE_TAG" --pattern "transfer-${RELEASE_TAG}-*" --dir transfer
      - name: Download pinned baselines for a corrective transfer
        run: |
          if [ "$(jq '(.baseAssets // []) | length' "transfer/transfer-${RELEASE_TAG}-manifest.json")" != 0 ]; then
            gh release download "$RELEASE_TAG" --pattern 'FxStudio-*-sources.zip' --pattern 'FxStudio-*-win-x64.zip' --dir baseline
          fi
      - name: Restore exact original ZIP bytes and verify hashes
        run: python3 tooling/release_transfer.py restore --manifest "transfer/transfer-${RELEASE_TAG}-manifest.json" --output restored --cache upstream-cache --base-directory baseline
      - name: Upload verified complete release ZIPs
        run: |
          if [ "$(jq '(.baseAssets // []) | length' "transfer/transfer-${RELEASE_TAG}-manifest.json")" != 0 ]; then
            for file in restored/FxStudio-*.zip; do mv "$file" "$(dirname "$file")/ready-$(basename "$file")"; done
            gh release upload "$RELEASE_TAG" restored/ready-FxStudio-*.zip --clobber
          else
            gh release upload "$RELEASE_TAG" restored/FxStudio-*-sources.zip restored/FxStudio-*-win-x64.zip
          fi
