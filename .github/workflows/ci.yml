name: Windows build and contract tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop, automation and tests
        run: dotnet build FxStudio.slnx --configuration Release
      - name: Core contract tests
        run: dotnet run --project tests/FxStudio.Core.Tests --configuration Release --no-build
      - name: Automation contract tests
        run: dotnet run --project tests/FxStudio.Automation.Tests --configuration Release --no-build
      - name: Check skill helper Python syntax
        run: python -m py_compile skills/fxstudio/scripts/fxstudio.py tooling/test_skill_bridge.py tooling/package_skill.py
      - name: Check engineering templates and helper contracts
        run: |
          python tooling/sync_engineering_skill.py --check
          python -m unittest discover -s tests -p test_engineering.py
      - name: Check legacy source compatibility and managed resource import
        run: |
          python -m pip install Pillow==11.3.0
          python tooling/sync_fxlib_compat.py --check
          python -m unittest discover -s tests -p test_fxlib_compat.py
          python -m unittest discover -s tests -p test_legacy_project.py
          python -m unittest discover -s tests -p test_project_assets.py
          python -m unittest discover -s tests -p test_package_components.py
          python tooling/check_loader_components.py
      - name: Verify pinned Loader components and offline contracts
        run: |
          python tooling/check_loader_components.py
          python -m unittest discover -s tests -p "test_*profile*.py" -v
          python -m unittest discover -s tests -p "test_caller_session.py" -v
          python tests/test_oversized_example.py
      - name: Publish merged desktop and automation runtime
        run: ./tooling/Publish-App.ps1 -StagingDirectory "$env:RUNNER_TEMP\fxstudio-published"
      - name: Verify actual merged runtime starts
        run: ./tooling/Test-PublishedApp.ps1 -ApplicationDirectory "$env:RUNNER_TEMP\fxstudio-published"
